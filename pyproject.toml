[project]
name = "nextgan"
version = "0.1.0"
description = "NextGAN: Towards Simple and Scalable GAN Training for Image and Video Generation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "diffusers==0.35.1",
    "einops==0.8.1",
    "numpy==1.26.4",
    "pillow==11.3.0",
    "pyyaml==6.0.2",
    "requests==2.32.5",
    "safetensors==0.6.2",
    "scipy==1.15.3",
    "timm==1.0.28",
    "torch==2.5.0",
    "torchvision==0.20.0",
    "tqdm==4.67.1",
    "transformers==4.56.2",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
